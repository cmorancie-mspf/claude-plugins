name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Manifests, frontmatter, scripts, no machine paths
        run: node .github/check.mjs
      - name: Python scripts parse
        run: python3 -m compileall -q -x "node_modules" .
      - name: expertise-miner tests (stand-ins only; no network)
        run: python3 expertise-miner/tests/test_miner.py
